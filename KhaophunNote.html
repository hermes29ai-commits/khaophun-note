<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--fd:'Quicksand',sans-serif;--fb:'Nunito',sans-serif;--rad:14px;--rs:8px;--tr:.3s cubic-bezier(.4,0,.2,1);--sbw:256px}
html{font-size:15px}body{font-family:var(--fb);color:var(--fg);overflow:hidden;height:100vh;transition:background var(--tr),color var(--tr)}
h1,h2,h3,h4{font-family:var(--fd)}button{font-family:var(--fb);cursor:pointer;border:none;background:none}
input,textarea,select{font-family:var(--fb)}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

.app{display:flex;height:100vh;position:relative;z-index:1}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx .b{position:absolute;border-radius:50%;filter:blur(80px);animation:bfl 20s ease-in-out infinite}
.bgfx .b:nth-child(1){width:380px;height:380px;background:var(--bl1);top:-8%;right:-4%}
.bgfx .b:nth-child(2){width:320px;height:320px;background:var(--bl2);bottom:-8%;left:8%;animation-delay:-7s}
.bgfx .b:nth-child(3){width:280px;height:280px;background:var(--bl3);top:38%;left:48%;animation-delay:-13s}
@keyframes bfl{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(25px,-35px) scale(1.08)}66%{transform:translate(-18px,18px) scale(.94)}}

/* SIDEBAR */
.sidebar{width:var(--sbw);min-width:var(--sbw);background:var(--sbg);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform var(--tr),min-width var(--tr),width var(--tr);overflow-y:auto;z-index:20}
.sidebar.col{transform:translateX(-100%);min-width:0;width:0;position:absolute}
.sbrand{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.sbrand .logo{width:44px;height:44px;flex-shrink:0}
.sbrand h1{font-size:1.06rem;font-weight:700;line-height:1.2}
.sbrand .sub{font-size:.64rem;color:var(--mt);display:block;margin-top:1px}
.snav{padding:12px 10px}
.navlbl{font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:var(--mt);font-weight:700;padding:0 10px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.navlbl .addbtn{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--mt);transition:color var(--tr)}
.navlbl .addbtn:hover{color:var(--acc)}
.ni{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--rs);color:var(--fg2);font-weight:600;font-size:.82rem;transition:all var(--tr);cursor:pointer;margin-bottom:2px;width:100%}
.ni i{width:17px;text-align:center;font-size:.84rem}
.ni:hover{background:var(--hov);color:var(--fg)}
.ni.act{background:var(--acc);color:#fff;box-shadow:0 3px 10px var(--accs)}
.sws{padding:6px 10px 14px;border-top:1px solid var(--bd);margin-top:2px}
.wi{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--rs);color:var(--fg2);font-weight:600;font-size:.8rem;transition:all var(--tr);cursor:pointer;margin-bottom:2px;width:100%;position:relative}
.wi .wdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.wi:hover{background:var(--hov)}
.wi.act{background:var(--hov);color:var(--fg)}
.wi .wcnt{margin-left:auto;font-size:.66rem;font-weight:700;background:var(--bd);color:var(--fg2);padding:1px 6px;border-radius:9px}
.wi .wedt{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:4px;display:none;align-items:center;justify-content:center;font-size:.6rem;color:var(--mt)}
.wi:hover .wedt{display:flex}
.wi:hover .wedt:hover{color:var(--acc)}
.wi:hover .wcnt{display:none}

/* TOP HEADER */
.thdr{height:54px;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid var(--bd);background:var(--bg2);flex-shrink:0;transition:background var(--tr)}
.thdr .menub{width:32px;height:32px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;color:var(--fg2);font-size:.95rem;transition:all var(--tr)}
.thdr .menub:hover{background:var(--hov);color:var(--fg)}
.ptitle{font-family:var(--fd);font-size:1rem;font-weight:700;display:flex;align-items:center;gap:7px}
.ptitle .wtag{display:inline-block;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:5px}
.spacer{flex:1}
.sbox{display:flex;align-items:center;gap:6px;background:var(--ibg);border:1px solid var(--bd);border-radius:var(--rs);padding:0 9px;height:32px;transition:all var(--tr);max-width:180px;width:100%}
.sbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.sbox i{color:var(--mt);font-size:.78rem}
.sbox input{border:none;background:none;outline:none;color:var(--fg);font-size:.8rem;width:100%}
.sbox input::placeholder{color:var(--mt)}
.langgrp{display:flex;gap:2px;background:var(--ibg);border:1px solid var(--bd);border-radius:var(--rs);padding:2px;height:32px}
.langbtn{padding:3px 8px;border-radius:5px;font-size:.68rem;font-weight:700;color:var(--fg2);transition:all var(--tr)}
.langbtn:hover{color:var(--fg)}.langbtn.act{background:var(--acc);color:#fff}
.hdrbtn{width:32px;height:32px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;color:var(--fg2);font-size:.9rem;transition:all var(--tr)}
.hdrbtn:hover{background:var(--hov);color:var(--acc)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:20px;transition:padding var(--tr)}

/* STATS */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:22px}
.statcard{background:var(--cd);border:1px solid var(--bd);border-radius:var(--rad);padding:13px 15px;transition:all var(--tr);position:relative;overflow:hidden}
.statcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.statcard:nth-child(1)::before{background:var(--acc)}.statcard:nth-child(2)::before{background:var(--wrn)}
.statcard:nth-child(3)::before{background:var(--inf)}.statcard:nth-child(4)::before{background:var(--suc)}
.statcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.statcard .sico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.86rem;margin-bottom:8px}
.statcard:nth-child(1) .sico{background:var(--accs);color:var(--acc)}
.statcard:nth-child(2) .sico{background:var(--wrnb);color:var(--wrn)}
.statcard:nth-child(3) .sico{background:var(--infb);color:var(--inf)}
.statcard:nth-child(4) .sico{background:var(--sucb);color:var(--suc)}
.statcard .snum{font-size:1.5rem;font-weight:800;line-height:1}
.statcard .slbl{font-size:.72rem;color:var(--mt);font-weight:600;margin-top:2px}
.progbar{background:var(--bd);border-radius:9px;height:10px;overflow:hidden;margin-bottom:4px}
.progfill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s cubic-bezier(.4,0,.2,1)}
.proglbl{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mt);font-weight:600;margin-bottom:18px}

/* LIST ITEMS */
.itemlist{display:flex;flex-direction:column;gap:5px}
.listi{display:flex;align-items:center;gap:9px;background:var(--cd);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 11px;transition:all var(--tr);cursor:pointer}
.listi:hover{border-color:var(--acc);transform:translateX(3px)}
.listi .lpri{width:4px;height:22px;border-radius:2px;flex-shrink:0}
.listi .lpri.high{background:var(--dng)}.listi .lpri.medium{background:var(--wrn)}.listi .lpri.low{background:var(--suc)}
.listi .linf{flex:1;min-width:0}
.listi .ltit{font-weight:700;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listi .lmet{font-size:.68rem;color:var(--mt);margin-top:1px}
.listi .lstat{font-size:.64rem;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.lstat.todo{background:var(--dngb);color:var(--dng)}.lstat.in-progress{background:var(--wrnb);color:var(--wrn)}.lstat.done{background:var(--sucb);color:var(--suc)}

/* KANBAN */
.kanboard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:calc(100vh - 130px)}
.kcol{background:var(--cd);border:1px solid var(--bd);border-radius:var(--rad);padding:11px;display:flex;flex-direction:column}
.kcol.dovr{border-color:var(--acc);background:var(--hov)}
.kcolhdr{display:flex;align-items:center;gap:6px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.kcolhdr .cdot{width:8px;height:8px;border-radius:50%}
.kcolhdr h3{font-size:.84rem;font-weight:700;flex:1}
.kcolhdr .ccnt{font-size:.66rem;font-weight:800;background:var(--bd);padding:1px 6px;border-radius:7px;color:var(--fg2)}
.kcolhdr .cadd{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--mt);font-size:.72rem;transition:all var(--tr)}
.kcolhdr .cadd:hover{background:var(--acc);color:#fff}
.kcolcards{flex:1;display:flex;flex-direction:column;gap:7px;min-height:35px}
.kcard{background:var(--cd2);border:1px solid var(--bd);border-radius:var(--rs);padding:10px;cursor:grab;transition:all var(--tr);position:relative}
.kcard:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.kcard.drag{opacity:.4;transform:rotate(2deg)}
.kcard .kpri{position:absolute;top:0;left:11px;width:22px;height:3px;border-radius:0 0 2px 2px}
.kcard .kpri.high{background:var(--dng)}.kcard .kpri.medium{background:var(--wrn)}.kcard .kpri.low{background:var(--suc)}
.kcard .ktit{font-weight:700;font-size:.8rem;margin-bottom:3px;padding-top:2px}
.kcard .kdsc{font-size:.72rem;color:var(--fg2);margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcard .kfoot{display:flex;align-items:center;justify-content:space-between}
.kcard .kdate{font-size:.66rem;color:var(--mt);display:flex;align-items:center;gap:3px}
.kcard .kacts{display:flex;gap:2px}
.kcard .kacts button{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.66rem;color:var(--mt);transition:all var(--tr)}
.kcard .kacts button:hover{background:var(--hov);color:var(--acc)}
.kcard .kacts .dbtn:hover{color:var(--dng);background:var(--dngb)}

/* CALENDAR */
.calbox{background:var(--cd);border:1px solid var(--bd);border-radius:var(--rad);overflow:hidden}
.calhdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd)}
.calhdr h3{font-size:.96rem;font-weight:700}
.calnav{display:flex;gap:4px}
.calnav button{height:30px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;color:var(--fg2);font-size:.8rem;transition:all var(--tr);background:var(--ibg);border:1px solid var(--bd);padding:0 8px}
.calnav button:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.calweekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--bd)}
.calwd{text-align:center;padding:7px 2px;font-size:.68rem;font-weight:700;color:var(--mt);letter-spacing:.3px}
.calwd.wkend{color:var(--acc)}
.caldays{display:grid;grid-template-columns:repeat(7,1fr)}
.calday{height:90px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:4px 5px;transition:background var(--tr);cursor:pointer;overflow:hidden}
.calday:nth-child(7n){border-right:none}
.calday:hover{background:var(--hov)}
.calday.other{opacity:.28}
.calday.istoday{background:var(--caltod)}
.calday.istoday .daynum span{background:var(--acc);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.calday.hasod{background:var(--calod)}
.calday.iswkend{background:var(--cwk)}
.daynum{font-size:.72rem;font-weight:700;color:var(--fg2);margin-bottom:2px;line-height:22px}
.calday.iswkend .daynum{color:var(--acc)}
.daytasks{display:flex;flex-direction:column;gap:1px}
.daytask{font-size:.6rem;font-weight:700;padding:1px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:filter var(--tr);border-left:2px solid;line-height:1.5}
.daytask:hover{filter:brightness(.92)}
.daytask.todo{background:var(--dngb);color:var(--dng);border-color:var(--dng)}
.daytask.in-progress{background:var(--wrnb);color:var(--wrn);border-color:var(--wrn)}
.daytask.done{background:var(--sucb);color:var(--suc);border-color:var(--suc);opacity:.6}
.daytask.overdue{background:var(--dngb);color:var(--dng);border-color:var(--dng);text-decoration:line-through}
.daymore{font-size:.58rem;color:var(--acc);font-weight:700;cursor:pointer;padding:0 3px}
.daymore:hover{text-decoration:underline}
.calegnd{display:flex;gap:12px;padding:8px 16px;border-top:1px solid var(--bd);flex-wrap:wrap}
.calegndi{display:flex;align-items:center;gap:4px;font-size:.66rem;color:var(--fg2);font-weight:600}
.calegndd{width:8px;height:8px;border-radius:2px}

/* TODO LIST */
.todolist{display:flex;flex-direction:column;gap:5px}
.todogrp{margin-bottom:12px}
.todogrp-hdr{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.todogrp-hdr .gdot{width:7px;height:7px;border-radius:50%}
.todogrp-hdr h3{font-size:.82rem;font-weight:700}
.todogrp-hdr .gcnt{font-size:.66rem;color:var(--mt);font-weight:600}
.todoitem{display:flex;align-items:center;gap:9px;background:var(--cd);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 11px;transition:all var(--tr)}
.todoitem:hover{border-color:var(--acc)}

.tcheck{width:20px;height:20px;border-radius:5px;border:2px solid var(--bd2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--tr);flex-shrink:0;font-size:.62rem;color:transparent}

.todoitem .tacts button:hover{background:var(--hov);color:var(--acc)}

/* NOTES */
.notesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}

.notecard .nwtag{font-size:.59rem;font-weight:700;padding:2px 6px;border-radius:4px;display:inline-block;margin-bottom:7px;width:fit-content}
.notecard h4{font-size:.86rem;font-weight:700;margin-bottom:5px;line-height:1.3}
.notecard .ncont{font-size:.74rem;color:var(--fg2);line-height:1.5;flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.notecard .nfoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px solid var(--bd)}
.notecard .ndate{font-size:.64rem;color:var(--mt)}
.notecard .nacts{display:flex;gap:2px}
.notecard .nacts button{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.66rem;color:var(--mt);transition:all var(--tr)}
.notecard .nacts button:hover{background:var(--hov);color:var(--acc)}
.addnotecard{background:var(--cd2);border:2px dashed var(--bd2);border-radius:var(--rad);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:all var(--tr);min-height:110px}
.addnotecard i{font-size:1.2rem;color:var(--mt)}.addnotecard span{font-size:.78rem;color:var(--mt);font-weight:600}
.addnotecard:hover{border-color:var(--acc);color:var(--acc)}.addnotecard:hover i,.addnotecard:hover span{color:var(--acc)}

/* DATA PAGE */
.databox{background:var(--cd);border:1px solid var(--bd);border-radius:var(--rad);padding:18px}
.databox h3{font-size:.92rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.databox h3 i{color:var(--acc)}
.datarows{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.datarow{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--cd2);border-radius:var(--rs);font-size:.8rem}
.datarow .dl{color:var(--fg2);font-weight:600}.datarow .dv{font-weight:800;color:var(--fg);font-family:monospace;font-size:.78rem}
.datacts{display:flex;gap:7px;flex-wrap:wrap}
.datainfo{background:var(--cd2);border-radius:var(--rs);padding:12px;margin-top:14px;font-size:.78rem;color:var(--fg2);line-height:1.7}

/* THEME PICKER */
.themegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.themepick{width:100%;aspect-ratio:1;border-radius:10px;cursor:pointer;transition:all var(--tr);border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:#fff}

.themepick.active{border-color:var(--fg);box-shadow:0 0 0 2px var(--acc)}
.themecustom{display:flex;align-items:center;gap:10px;margin-top:10px}
.themecustom label{font-size:.78rem;font-weight:700;color:var(--fg2)}
.themecustom input[type=color]{width:44px;height:34px;border:1px solid var(--bd);border-radius:var(--rs);cursor:pointer;background:none;padding:2px}

.modalov{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modalov.show{opacity:1;pointer-events:all}
.modalbox{background:var(--cd);border-radius:var(--rad);box-shadow:0 16px 48px rgba(0,0,0,.14);width:92%;max-width:460px;max-height:85vh;overflow-y:auto;transform:translateY(16px) scale(.97);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.modalov.show .modalbox{transform:translateY(0) scale(1)}
.modalhdr{padding:14px 18px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.modalhdr h3{font-size:.94rem;font-weight:700}
.modalclose{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--mt);font-size:.8rem;transition:all var(--tr)}

.formgrp input,.formgrp textarea,.formgrp select{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--ibg);color:var(--fg);font-size:.82rem;outline:none;transition:all var(--tr)}

.formrow{display:flex;gap:9px}.formrow .formgrp{flex:1}
.modalfoot{padding:10px 18px 14px;display:flex;justify-content:flex-end;gap:7px}
.btn{padding:7px 14px;border-radius:var(--rs);font-weight:700;font-size:.8rem;transition:all var(--tr);display:inline-flex;align-items:center;gap:5px}
.btn-p{background:var(--acc);color:#fff;box-shadow:0 3px 10px var(--accs)}.btn-p:hover{background:var(--acc2);transform:translateY(-1px)}
.btn-s{background:var(--bd);color:var(--fg2)}.btn-s:hover{background:var(--bd2)}
.btn-d{background:var(--dngb);color:var(--dng)}.btn-d:hover{background:var(--dng);color:#fff}

.btn-w{background:var(--wrnb);color:var(--wrn)}.btn-w:hover{background:var(--wrn);color:#fff}

/* CONFIRM */
.cficon{font-size:2.8rem;margin-bottom:10px}
.cftitle{font-size:1rem;font-weight:700;margin-bottom:6px}
.cfdesc{font-size:.82rem;color:var(--fg2);line-height:1.6}

.toastcont{position:fixed;top:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:5px}

.toast.leaving{animation:tout .3s forwards}
.toast i{font-size:.88rem}
.toast.success i{color:var(--suc)}.toast.error i{color:var(--dng)}.toast.info i{color:var(--inf)}
@keyframes tin{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes tout{to{transform:translateX(110%);opacity:0}}

.fab{position:fixed;bottom:22px;right:22px;width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 20px var(--accs);transition:all var(--tr);z-index:30}
.fab:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 28px var(--accs)}

.emptystate{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 14px;color:var(--mt)}

.sbOverlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40;opacity:0;pointer-events:none;transition:opacity var(--tr)}

function saveData(skipSync) {
  try {
    ST.updatedAt = new Date().toISOString();
    localStorage.setItem(LS_KEY, JSON.stringify({
      tasks:ST.tasks, notes:ST.notes, workspaces:ST.workspaces,
      lang:ST.lang, dark:ST.dark, vm:ST.vm, ws:ST.ws,
      calYear:ST.calYear, calMonth:ST.calMonth,
      themePreset:ST.themePreset, customHue:ST.customHue,
      updatedAt:ST.updatedAt
    }));
  } catch(e) { console.error('Save error:', e); }
  if(!skipSync) scheduleSync();
}

function loadData() {
  try {

      var d = JSON.parse(raw);

      ST.calYear = d.calYear || new Date().getFullYear();

var SYNC_KEY = 'khaophun_sync';

// ★ วาง Web App URL จาก Apps Script ตรงนี้ครั้งเดียว (ในเครื่องหมายคำพูด)
//    ทุกเครื่องที่เปิดแอปจะเปิดซิงก์อัตโนมัติทันที ไม่ต้องตั้งค่าอะไรอีก
//    เว้นว่างไว้ = ตั้งค่าเองในหน้า "จัดการข้อมูล" เหมือนเดิม
var DEFAULT_SYNC_URL = 'https://script.google.com/macros/s/AKfycbw5xSDKSC_z1rziv9Jdi8bsVoE6aDP86Ko4STvrIMfeX9GtoEPZmI5nPK-hX19NlxTY/exec';

var SYNC = { url:'', on:false, last:null, status:'idle' };
var syncTimer = null;

function loadSync(){
  try{ var r=localStorage.getItem(SYNC_KEY); if(r){ var d=JSON.parse(r); SYNC.url=d.url||''; SYNC.on=!!d.on; SYNC.last=d.last||null; } }catch(e){}
  // ถ้ายังไม่เคยตั้งค่าในเครื่องนี้ และมี URL ฝังไว้ในไฟล์ → เปิดซิงก์ให้เลย
  if(!SYNC.url && DEFAULT_SYNC_URL){ SYNC.url = DEFAULT_SYNC_URL; SYNC.on = true; saveSync(); }
}
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify({url:SYNC.url,on:SYNC.on,last:SYNC.last})); }catch(e){} }
function snapshot(){ return { tasks:ST.tasks, notes:ST.notes, workspaces:ST.workspaces, updatedAt:ST.updatedAt||new Date().toISOString() }; }
function scheduleSync(){ if(!SYNC.on||!SYNC.url) return; clearTimeout(syncTimer); syncTimer=setTimeout(function(){pushSync(false);},2500); }
function refreshSyncUI(){ if(ST.view==='data') renderContent(); }

function pushSync(manual){
  if(!SYNC.url){ if(manual) showToast(T('syncNoUrl'),'error'); return; }
  SYNC.status='syncing'; refreshSyncUI();
  // POST เป็น text/plain เพื่อเลี่ยง CORS preflight (Apps Script อ่านจาก e.postData.contents)
  fetch(SYNC.url, { method:'POST', body: JSON.stringify({ action:'save', data:snapshot() }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok){ SYNC.last=new Date().toISOString(); SYNC.status='ok'; saveSync(); if(manual) showToast(T('syncOk')); }
      else { SYNC.status='error'; if(manual) showToast(T('syncFail'),'error'); }
      refreshSyncUI();
    })
    .catch(function(){ SYNC.status='error'; refreshSyncUI(); if(manual) showToast(T('syncFail'),'error'); });
}

function pullSync(manual){
  if(!SYNC.url){ if(manual) showToast(T('syncNoUrl'),'error'); return; }
  SYNC.status='syncing'; refreshSyncUI();
  fetch(SYNC.url + (SYNC.url.indexOf('?')>-1?'&':'?') + 'action=load')
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok && res.data && Array.isArray(res.data.tasks)){
        var rm = res.data;
        if(!ST.updatedAt || (rm.updatedAt && rm.updatedAt > ST.updatedAt)){
          ST.tasks = rm.tasks; ST.notes = rm.notes||[];
          if(rm.workspaces && rm.workspaces.length) ST.workspaces = rm.workspaces;
          ST.updatedAt = rm.updatedAt || ST.updatedAt;
          saveData(true); renderSidebar(); renderContent(); updatePageTitle();
          if(manual) showToast(T('syncPulled'));
        } else if(manual){ showToast(T('syncUpToDate')); }
        SYNC.last=new Date().toISOString(); SYNC.status='ok'; saveSync();
      } else { SYNC.status = (res && res.ok) ? 'ok' : 'error'; if(manual&&SYNC.status==='error') showToast(T('syncFail'),'error'); }
      refreshSyncUI();
    })
    .catch(function(){ SYNC.status='error'; refreshSyncUI(); if(manual) showToast(T('syncFail'),'error'); });
}

function toggleSync(){
  var inp = document.getElementById('syncUrlIn');
  var u = inp ? inp.value.trim() : SYNC.url;
  if(!SYNC.on){
    if(!u){ showToast(T('syncNoUrl'),'error'); return; }
    SYNC.url = u; SYNC.on = true; saveSync(); renderContent();
    pushSync(true);
  } else {
    SYNC.url = u || SYNC.url; SYNC.on = false; saveSync(); renderContent();
    showToast(T('syncOffT'),'info');
  }
}
function saveSyncUrl(){ var inp=document.getElementById('syncUrlIn'); if(inp){ SYNC.url=inp.value.trim(); saveSync(); } }

// ===== HELPERS =====
function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2,5); }
function isOverdue(ds, st) { if(!ds || st==='done') return false; return new Date(ds+'T23:59:59') < new Date(); }
function fmtDate(ds) {
  if(!ds) return T('noDue');
  var d = new Date(ds+'T00:00:00'), n = new Date(); n.setHours(0,0,0,0);
  var diff = Math.floor((d-n)/864e5);
  if(diff<0) return T('overdue'); if(diff===0) return T('today');
  return d.toLocaleDateString(ST.lang==='th'?'th-TH':'en-US',{day:'numeric',month:'short'});
}
function filteredTasks() {
  var r = ST.tasks.filter(function(x){return x.workspace===ST.ws;});
  if(ST.q) { var q=ST.q.toLowerCase(); r=r.filter(function(x){return x.title.toLowerCase().indexOf(q)!==-1 || (x.description||'').toLowerCase().indexOf(q)!==-1;}); }
  return r;
}
function filteredNotes() {
  var r = ST.notes.filter(function(x){return x.workspace===ST.ws;});
  if(ST.q) { var q=ST.q.toLowerCase(); r=r.filter(function(x){return x.title.toLowerCase().indexOf(q)!==-1 || (x.content||'').toLowerCase().indexOf(q)!==-1;}); }
  return r;
}
function wsName(id) { var w=ST.workspaces.find(function(x){return x.id===id;}); return w?w.name:id; }
function wsColor(id) { var w=ST.workspaces.find(function(x){return x.id===id;}); return w?w.color:'#F47B9E'; }
function hexToHue(hex) {
  var r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), h=0;
  if(mx!==mn){var d=mx-mn; if(mx===r)h=((g-b)/d+(g<b?6:0))/6; else if(mx===g)h=((b-r)/d+2)/6; else h=((r-g)/d+4)/6;}
  return Math.round(h*360);
}
function hslToHex(h,s,l) {
  s/=100;l/=100;var a=s*Math.min(l,1-l);
  var f=function(n){var k=(n+h/30)%12;var c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0');};
  return '#'+f(0)+f(8)+f(4);
}

function showToast(msg, type) {
  type = type || 'success';
  var c = document.getElementById('toastC');
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  var icons = {success:'fa-check-circle',error:'fa-exclamation-circle',info:'fa-info-circle'};
  el.innerHTML = '<i class="fas '+(icons[type]||icons.info)+'"></i><span>'+msg+'</span>';
  c.appendChild(el);
  setTimeout(function(){ el.classList.add('leaving'); setTimeout(function(){el.remove();},300); },2400);
}

// ================================================================
function renderContent() {
  var el = document.getElementById('mainContent');
  switch(ST.view) {
    case 'overview': el.innerHTML = renderOverview(); break;
    case 'kanban': el.innerHTML = renderKanban(); break;
    case 'calendar': el.innerHTML = renderCalendar(); break;
    case 'todo': el.innerHTML = renderTodo(); break;
    case 'notes': el.innerHTML = renderNotes(); break;
    case 'data': el.innerHTML = renderData(); break;
    default: el.innerHTML = renderOverview();
  }
}

// ----- Overview -----
function renderOverview() {
  var ts = filteredTasks();
  var tot=ts.length, tc=ts.filter(function(x){return x.status==='todo';}).length;
  var ic=ts.filter(function(x){return x.status==='in-progress';}).length;
  var dc=ts.filter(function(x){return x.status==='done';}).length;
  var rate = tot>0 ? Math.round(dc/tot*100) : 0;
  var rec = ts.slice().sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');}).slice(0,5);
  var rhtml = '';
  if(!rec.length) {
    rhtml = '<div class="emptystate"><i class="fas fa-inbox"></i><p>'+T('noTasks')+'</p></div>';
  } else {
    rhtml = '<div class="itemlist">';
    for(var i=0;i<rec.length;i++){
      var x=rec[i], od=isOverdue(x.dueDate,x.status);
      rhtml += '<div class="listi anim" onclick="showTaskModal(\''+x.id+'\')"><div class="lpri '+x.priority+'"></div><div class="linf"><div class="ltit">'+(od?'⚠ ':'')+x.title+'</div><div class="lmet">'+fmtDate(x.dueDate)+'</div></div><span class="lstat '+x.status+'">'+(x.status==='todo'?T('todo_s'):T(x.status))+'</span></div>';
    }
    rhtml += '</div>';
  }
  return '<div class="anim" style="margin-bottom:18px"><h2 style="font-size:1.3rem;font-weight:700">'+T('greet')+'</h2><p style="color:var(--fg2);font-size:.84rem">'+T('greetSub')+'</p></div>'+
    '<div class="statgrid"><div class="statcard anim"><div class="sico"><i class="fas fa-layer-group"></i></div><div class="snum">'+tot+'</div><div class="slbl">'+T('total')+'</div></div><div class="statcard anim"><div class="sico"><i class="fas fa-clock"></i></div><div class="snum">'+tc+'</div><div class="slbl">'+T('todoT')+'</div></div><div class="statcard anim"><div class="sico"><i class="fas fa-spinner"></i></div><div class="snum">'+ic+'</div><div class="slbl">'+T('ipT')+'</div></div><div class="statcard anim"><div class="sico"><i class="fas fa-check-double"></i></div><div class="snum">'+dc+'</div><div class="slbl">'+T('doneT')+'</div></div></div>'+
    '<div class="anim"><h3 style="font-size:.88rem;font-weight:700;margin-bottom:7px">'+T('compRate')+' — '+rate+'%</h3><div class="progbar"><div class="progfill" style="width:'+rate+'%"></div></div><div class="proglbl"><span>'+dc+' '+T('done')+'</span><span>'+tot+' '+T('total')+'</span></div></div>'+
    '<div class="anim"><h3 style="font-size:.88rem;font-weight:700;margin-bottom:7px">'+T('recent')+'</h3>'+rhtml+'</div>';
}

// ----- Kanban -----
function renderKanban() {

// ----- Calendar -----
function renderCalendar() {
  var y=ST.calYear, m=ST.calMonth;
  var dn=T('dayNames'), mn=T('monthNames')[m];
  var fd=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(), dpm=new Date(y,m,0).getDate();
  var now=new Date(); now.setHours(0,0,0,0);
  var ts=filteredTasks();
  var tmap={};
  for(var i=0;i<ts.length;i++){ var tk=ts[i]; if(!tk.dueDate) continue; if(!tmap[tk.dueDate]) tmap[tk.dueDate]=[]; tmap[tk.dueDate].push(tk); }
  // overdue แสดงในวันนี้
  var odTs=ts.filter(function(x){return isOverdue(x.dueDate,x.status);});
  var todayStr=now.toISOString().split('T')[0];
  if(odTs.length && todayStr){ if(!tmap[todayStr]) tmap[todayStr]=[]; for(var oi=0;oi<odTs.length;oi++){var ot=odTs[oi]; if(ot.dueDate!==todayStr && !tmap[todayStr].find(function(z){return z.id===ot.id;})) tmap[todayStr].push(ot);} }

  var cells=[];
  for(var pi=fd-1;pi>=0;pi--) cells.push({d:dpm-pi,m:m-1,y:m===0?y-1:y,om:true});
  for(var di=1;di<=dim;di++) cells.push({d:di,m:m,y:y,om:false});
  var rem=42-cells.length; for(var ri=1;ri<=rem;ri++) cells.push({d:ri,m:m+1,y:m===11?y+1:y,om:true});
  if(cells.length>35 && cells.slice(35).every(function(c){return c.om;})) cells.length=35;

  var maxShow=2;
  var whtml=''; for(var wi=0;wi<dn.length;wi++) whtml+='<div class="calwd '+(wi===0||wi===6?'wkend':'')+'">'+dn[wi]+'</div>';
  var dhtml='';
  for(var ci=0;ci<cells.length;ci++){
    var c=cells[ci];
    var ds=c.y+'-'+String(c.m+1).padStart(2,'0')+'-'+String(c.d).padStart(2,'0');
    var isT=!c.om&&c.d===now.getDate()&&m===now.getMonth()&&y===now.getFullYear();
    var dow=new Date(c.y,c.m,c.d).getDay(), isW=dow===0||dow===6;
    var cls='calday'; if(c.om) cls+=' other'; if(isT) cls+=' istoday'; if(isW&&!c.om) cls+=' iswkend';
    var ct=tmap[ds]||[]; var hasOD=ct.some(function(x){return isOverdue(x.dueDate,x.status);});
    if(hasOD&&!isT) cls+=' hasod';
    var thtml=''; var vis=ct.slice(0,maxShow), hid=ct.length-maxShow;
    for(var vi=0;vi<vis.length;vi++){
      var tk=vis[vi], od=isOverdue(tk.dueDate,tk.status);
      thtml+='<div class="daytask '+(od?'overdue':tk.status)+'" onclick="event.stopPropagation();showTaskModal(\''+tk.id+'\')" title="'+tk.title+'">'+tk.title+'</div>';
    }
    if(hid>0) thtml+='<div class="daymore" onclick="event.stopPropagation();showDayModal(\''+ds+'\')">+'+hid+' '+T('more')+'</div>';
    dhtml+='<div class="'+cls+'" onclick="showDayModal(\''+ds+'\')"><div class="daynum"><span>'+c.d+'</span></div><div class="daytasks">'+thtml+'</div></div>';
  }
  var dy=ST.lang==='th'?y+543:y;
  return '<div class="calbox anim"><div class="calhdr"><h3>'+mn+' '+dy+'</h3><div class="calnav"><button onclick="calNav(-1)"><i class="fas fa-chevron-left"></i></button><button style="padding:0 10px;font-size:.7rem;font-weight:700" onclick="calToday()">'+T('calToday')+'</button><button onclick="calNav(1)"><i class="fas fa-chevron-right"></i></button></div></div><div class="calweekdays">'+whtml+'</div><div class="caldays">'+dhtml+'</div><div class="calegnd"><div class="calegndi"><div class="calegndd" style="background:var(--dng)"></div>'+T('lgTodo')+'</div><div class="calegndi"><div class="calegndd" style="background:var(--wrn)"></div>'+T('lgProg')+'</div><div class="calegndi"><div class="calegndd" style="background:var(--suc)"></div>'+T('lgDone')+'</div><div class="calegndi"><div class="calegndd" style="background:var(--dng);opacity:.5"></div>'+T('lgOD')+'</div></div></div>';
}
function calNav(d){ST.calMonth+=d;if(ST.calMonth>11){ST.calMonth=0;ST.calYear++;}if(ST.calMonth<0){ST.calMonth=11;ST.calYear--;}saveData();renderContent();}
function calToday(){var n=new Date();ST.calYear=n.getFullYear();ST.calMonth=n.getMonth();saveData();renderContent();}
function showDayModal(ds){
  var all=ST.tasks.filter(function(x){return x.workspace===ST.ws;}); var dt=all.filter(function(x){return x.dueDate===ds;});
  var now=new Date();now.setHours(0,0,0,0);var tStr=now.toISOString().split('T')[0];
  if(ds===tStr){var od=all.filter(function(x){return isOverdue(x.dueDate,x.status)&&x.dueDate!==tStr;});dt=dt.concat(od);}
  var d=new Date(ds+'T00:00:00'),dl=d.toLocaleDateString(ST.lang==='th'?'th-TH':'en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('modalTitle').textContent=dl;
  if(!dt.length){document.getElementById('modalBody').innerHTML='<div class="emptystate" style="padding:20px 8px"><i class="fas fa-calendar-check"></i><p>'+T('noTasks')+'</p></div>';}
  else{var h='<div class="itemlist">';for(var i=0;i<dt.length;i++){var x=dt[i],od=isOverdue(x.dueDate,x.status);h+='<div class="listi" onclick="closeModal();setTimeout(function(){showTaskModal(\''+x.id+'\')},200)" style="cursor:pointer"><div class="lpri '+x.priority+'"></div><div class="linf"><div class="ltit">'+(od?'⚠ ':'')+x.title+'</div><div class="lmet">'+(x.description||'')+'</div></div><span class="lstat '+(od?'todo':x.status)+'">'+(od?T('overdue'):(x.status==='todo'?T('todo_s'):T(x.status)))+'</span></div>';}h+='</div>';document.getElementById('modalBody').innerHTML=h;}
  document.getElementById('modalFoot').innerHTML='<button class="btn btn-s" onclick="closeModal()">'+T('cancel')+'</button><button class="btn btn-p" onclick="closeModal();showTaskModal(null);setTimeout(function(){var e=document.getElementById(\'fDt\');if(e)e.value=\''+ds+'\';},250)">'+T('addTask')+'</button>';
  openModal();
}

    '<div class="formgrp" style="margin-top:10px"><label>'+T('syncUrlLbl')+'</label><input type="text" id="syncUrlIn" placeholder="https://script.google.com/macros/s/…/exec" value="'+SYNC.url.replace(/"/g,'&quot;')+'" onchange="saveSyncUrl()"/></div>'+
    '<div class="datacts">'+
      '<button class="btn '+(SYNC.on?'btn-s':'btn-p')+'" onclick="toggleSync()"><i class="fas fa-cloud"></i> '+(SYNC.on?T('syncOffBtn'):T('syncOnBtn'))+'</button>'+

// ================================================================
// WORKSPACE CRUD
// ================================================================
function showWsModal(wid) {
  var w = wid ? ST.workspaces.find(function(x){return x.id===wid;}) : null;
  ST.editId = wid || null;
  var isE = !!w;
  document.getElementById('modalTitle').textContent = isE ? T('editWs') : T('addWs');
  document.getElementById('modalBody').innerHTML =
    '<div class="formgrp"><label>'+T('wsName')+' *</label><input type="text" id="wName" value="'+(isE?w.name.replace(/"/g,'&quot;'):'')+'"/></div>'+
    '<div class="formgrp"><label>'+T('wsColor')+'</label><input type="color" id="wColor" value="'+(isE?w.color:'#F47B9E')+'" style="width:60px;height:36px;border:1px solid var(--bd);border-radius:var(--rs);cursor:pointer;padding:2px"/></div>';
  document.getElementById('modalFoot').innerHTML =
    (isE?'<button class="btn btn-d" onclick="deleteWs(\''+w.id+'\')"><i class="fas fa-trash"></i> '+T('delete')+'</button>':'')+
    '<div style="flex:1"></div><button class="btn btn-s" onclick="closeModal()">'+T('cancel')+'</button><button class="btn btn-p" onclick="saveWs()">'+T('save')+'</button>';
  openModal();
  setTimeout(function(){var el=document.getElementById('wName');if(el)el.focus();},200);
}
function saveWs() {
  var nm = document.getElementById('wName').value.trim();
  if(!nm){document.getElementById('wName').style.borderColor='var(--dng)';showToast(T('req'),'error');return;}
  var cl = document.getElementById('wColor').value;
  if(ST.editId){
    var idx = ST.workspaces.findIndex(function(x){return x.id===ST.editId;});
    if(idx!==-1){ST.workspaces[idx].name=nm;ST.workspaces[idx].color=cl;showToast(T('tUpdated'));}
  } else {
    ST.workspaces.push({id:'ws_'+Date.now(),name:nm,color:cl});
    showToast(T('tAdded'));
  }
  closeModal(); renderSidebar(); renderContent(); updatePageTitle(); saveData();
}
function deleteWs(id) {
  var w = ST.workspaces.find(function(x){return x.id===id;}); if(!w) return;
  var tcnt = ST.tasks.filter(function(x){return x.workspace===id;}).length;
  var ncnt = ST.notes.filter(function(x){return x.workspace===id;}).length;
  closeModal();
  setTimeout(function(){
    showConfirm(T('cfDelWs'), T('cfDelWsDesc')+' ('+w.name+' — '+tcnt+' '+T('dataTk')+', '+ncnt+' '+T('dataNt')+')', function(){
      ST.tasks = ST.tasks.filter(function(x){return x.workspace!==id;});
      ST.notes = ST.notes.filter(function(x){return x.workspace!==id;});
      ST.workspaces = ST.workspaces.filter(function(x){return x.id!==id;});
      if(ST.ws===id) ST.ws = ST.workspaces.length ? ST.workspaces[0].id : '';
      if(!ST.workspaces.length){ST.workspaces=[{id:'ws_def',name:'My Workspace',color:'#F47B9E'}];ST.ws='ws_def';}
      renderSidebar(); renderContent(); updatePageTitle(); saveData(); showToast(T('tDeleted'),'info');
    });
  },300);
}

// ================================================================
// TASK CRUD
// ================================================================
function showTaskModal(tid, defaultStatus) {
  var task = tid ? ST.tasks.find(function(x){return x.id===tid;}) : null;
  ST.editId = tid || null;
  var isE = !!task;
  document.getElementById('modalTitle').textContent = isE ? T('editTask') : T('addTask');
  var so='<option value="todo" '+(task&&task.status==='todo'?'selected':'')+'>'+T('todo_s')+'</option><option value="in-progress" '+(task&&task.status==='in-progress'?'selected':'')+'>'+T('inProgress')+'</option><option value="done" '+(task&&task.status==='done'?'selected':'')+'>'+T('done')+'</option>';
  var po='<option value="high" '+(task&&task.priority==='high'?'selected':'')+'>'+T('high')+'</option><option value="medium" '+(task&&task.priority==='medium'?'selected':'')+'>'+T('medium')+'</option><option value="low" '+(task&&task.priority==='low'?'selected':'')+'>'+T('low')+'</option>';
  var wo=''; for(var i=0;i<ST.workspaces.length;i++){var w=ST.workspaces[i]; wo+='<option value="'+w.id+'" '+((task?task.workspace:ST.ws)===w.id?'selected':'')+'>'+w.name+'</option>';}
  document.getElementById('modalBody').innerHTML =
    '<div class="formgrp"><label>'+T('title')+'</label><input type="text" id="fT" value="'+(task?task.title.replace(/"/g,'&quot;'):'')+'"/></div>'+
    '<div class="formgrp"><label>'+T('desc')+'</label><textarea id="fD">'+(task?task.description:'')+'</textarea></div>'+
    '<div class="formrow"><div class="formgrp"><label>'+T('status')+'</label><select id="fS">'+so+'</select></div><div class="formgrp"><label>'+T('priority')+'</label><select id="fP">'+po+'</select></div></div>'+
    '<div class="formrow"><div class="formgrp"><label>'+T('dueDate')+'</label><input type="date" id="fDt" value="'+(task?task.dueDate:'')+'"/></div><div class="formgrp"><label>'+T('workspace')+'</label><select id="fW">'+wo+'</select></div></div>';
  if(!isE && defaultStatus) setTimeout(function(){var s=document.getElementById('fS');if(s)s.value=defaultStatus;},50);
  document.getElementById('modalFoot').innerHTML =
    (isE?'<button class="btn btn-d" onclick="deleteTask(\''+task.id+'\')"><i class="fas fa-trash"></i> '+T('delete')+'</button>':'')+
    '<div style="flex:1"></div><button class="btn btn-s" onclick="closeModal()">'+T('cancel')+'</button><button class="btn btn-p" onclick="saveTask()">'+T('save')+'</button>';
  openModal();
  setTimeout(function(){var el=document.getElementById('fT');if(el)el.focus();},200);
}
function saveTask() {
  var ti=document.getElementById('fT').value.trim();
  if(!ti){document.getElementById('fT').style.borderColor='var(--dng)';showToast(T('req'),'error');return;}
  var d={title:ti,description:document.getElementById('fD').value.trim(),status:document.getElementById('fS').value,priority:document.getElementById('fP').value,dueDate:document.getElementById('fDt').value,workspace:document.getElementById('fW').value};
  if(ST.editId){var idx=ST.tasks.findIndex(function(x){return x.id===ST.editId;});if(idx!==-1){for(var k in d)ST.tasks[idx][k]=d[k];showToast(T('tUpdated'));}}
  else{d.id=genId();d.createdAt=new Date().toISOString().split('T')[0];ST.tasks.push(d);showToast(T('tAdded'));}
  closeModal();saveData();renderSidebar();renderContent();
}
function deleteTask(id) {
  showConfirm(T('cfDel'),T('cfDelDesc'),function(){
    ST.tasks=ST.tasks.filter(function(x){return x.id!==id;});
    showToast(T('tDeleted'),'info');saveData();renderSidebar();renderContent();
  });
}
function toggleDone(id) {
  var x=ST.tasks.find(function(t){return t.id===id;});
  if(x){x.status=x.status==='done'?'todo':'done';saveData();renderContent();}
}

// ================================================================
// DRAG & DROP
// ================================================================
var dragId = null;
function dragStart(e,id) { dragId=id; e.dataTransfer.effectAllowed='move'; e.target.classList.add('drag'); }
function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect='move'; e.currentTarget.classList.add('dovr'); }
function dragLeave(e) { e.currentTarget.classList.remove('dovr'); }
function dragDrop(e,ns) {
  e.preventDefault(); e.currentTarget.classList.remove('dovr');
  if(dragId){var x=ST.tasks.find(function(t){return t.id===dragId;});if(x){x.status=ns;saveData();renderContent();showToast(T('tUpdated'));}dragId=null;}
}

// ================================================================
// DATA ACTIONS
// ================================================================
function exportData() {
  try {
    var d=JSON.stringify({tasks:ST.tasks,notes:ST.notes,workspaces:ST.workspaces,exportedAt:new Date().toISOString(),app:'Khaophun Note'},null,2);
    var b=new Blob([d],{type:'application/json'});var u=URL.createObjectURL(b);
    var a=document.createElement('a');a.href=u;a.download='khaophun_backup_'+new Date().toISOString().split('T')[0]+'.json';a.click();URL.revokeObjectURL(u);
    showToast(T('expOk'));
  } catch(e){showToast('Export failed','error');}
}
function importData(ev) {
  var f=ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!d.tasks||!Array.isArray(d.tasks))throw 0;
      ST.tasks=d.tasks;ST.notes=d.notes||[];if(d.workspaces)ST.workspaces=d.workspaces;
      saveData();renderSidebar();renderContent();updatePageTitle();showToast(T('impOk'));
    }catch(er){showToast(T('impFail'),'error');}
  };
  r.readAsText(f);ev.target.value='';
}
function clearData() {
  showConfirm(T('cfClear'),T('cfClearDesc'),function(){
    ST.tasks=[];ST.notes=[];
    try{localStorage.removeItem(LS_KEY);}catch(e){}
    saveData();renderSidebar();renderContent();showToast(T('clrOk'),'info');
  });
}

// ===== FAB =====
function onFab() { ST.view==='notes' ? showNoteModal() : showTaskModal(null); }
